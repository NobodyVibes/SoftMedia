# CLA Assistant — requires contributors to sign the CLA (see CLA.md) once, on their first PR.
#
# SETUP REQUIRED (maintainer, one-time):
#   1. Create a classic Personal Access Token with `repo` scope and add it as the repo secret
#      PERSONAL_ACCESS_TOKEN (used to write the signatures file). GITHUB_TOKEN cannot write to the
#      signature store, so the PAT is needed.
#   2. (Optional) point `path-to-signatures` at a separate private repo if you prefer not to store
#      signatures in this repo.
# Until the PAT secret exists, this workflow is inert (it will no-op / error only on PRs).
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures/signatures.json'
          path-to-document: 'https://github.com/NobodyVibes/SoftMedia/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],renovate[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
